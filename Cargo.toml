[package]
name = "smarts-evolution"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
indicatif = ["std", "dep:indicatif"]
std = ["dep:rayon", "log/std", "smarts-rs/std"]
tui = ["std", "dep:base64", "dep:ratatui", "dep:arboard"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
elements_rs = "0.2.3"
smarts-rs = { git = "https://github.com/earth-metabolome-initiative/smarts-rs", branch = "main" }
smiles-rs = { git = "https://github.com/earth-metabolome-initiative/smiles-rs", branch = "main" }
rand = { version = "0.10.1", default-features = false, features = ["alloc", "std_rng"] }
getrandom = { version = "0.4.2", features = ["wasm_js"] }
log = { version = "0.4.29", default-features = false }
hashbrown = { version = "0.17.0", default-features = false, features = ["default-hasher"] }
indicatif = { version = "0.18.4", default-features = false, optional = true }
base64 = { version = "0.22.1", optional = true }
ratatui = { version = "0.30.0", optional = true }
rayon = { version = "1.12.0", optional = true }
# Text-only native clipboard for the TUI copy buttons. Default features are
# disabled so we avoid the image dependency tree; on Linux this uses the
# pure-Rust x11rb backend (no system libraries to link), keeping CI clean. When
# no native clipboard is reachable (headless or remote SSH sessions) the TUI
# falls back to a terminal OSC 52 sequence, with tmux passthrough wrapping.
arboard = { version = "3.6.1", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "evolution"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
expect_used = "warn"
panic = "warn"
unwrap_used = "warn"
